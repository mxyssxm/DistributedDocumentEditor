[package]
name = "distributed_doc_system"
version = "0.1.0"
edition = "2021"
default-run = "distributed_doc_system" 

[dependencies]
zenoh = "1.0.2"
tokio = { version = "1", features = ["full"] }
futures = "0.3"


actix = "0.13"
actix-web = "4"
actix-files = "0.6"


serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }